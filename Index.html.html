<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Norm’s Question Counter</title>
<style>
:root{--a:#35d07f;--bg:#08111f;--card:#142034;--muted:#aeb9c9}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;color:#f4f7fb;font-family:system-ui;background:radial-gradient(circle at top,#263b5b,var(--bg) 55%);transition:.5s}body.warm{background:radial-gradient(circle at top,#8a4d19,#29161a 42%,#100d16)}body.limit{background:radial-gradient(circle at top,#a72626,#220b13 45%,#090910)}.app{width:min(680px,100%);overflow:hidden;border:1px solid #ffffff24;border-radius:28px;background:#142034eb;box-shadow:0 24px 80px #0007;backdrop-filter:blur(14px)}header{padding:32px 30px 22px;text-align:center}h1{margin:0 0 8px;font-size:clamp(2rem,6vw,3.3rem);letter-spacing:-.05em}.subtitle{margin:0;color:var(--muted);font-size:1.05rem}main{padding:0 30px 30px}.counter{margin:14px 0 22px;text-align:center}.number{font-size:clamp(5rem,22vw,9rem);line-height:.9;font-weight:850;letter-spacing:-.08em;color:var(--a);transition:.4s}.bump{transform:scale(1.1)}.of{margin-top:12px;color:var(--muted);font-size:1.1rem}.meter{height:18px;margin:24px 0 12px;overflow:hidden;border-radius:99px;background:#ffffff1c}.fill{height:100%;width:0;border-radius:inherit;background:var(--a);transition:.45s}.status{min-height:28px;text-align:center;color:var(--muted);font-weight:650}button{width:100%;margin-top:24px;padding:19px 24px;border:0;border-radius:16px;color:#06130c;background:var(--a);font:inherit;font-size:1.15rem;font-weight:850;cursor:pointer;box-shadow:0 8px 24px #35d07f38}button:active{transform:scale(.98)}button:disabled{cursor:not-allowed;color:white;background:#8c2630;box-shadow:none}.reset{display:block;width:auto;margin:14px auto 0;padding:8px 14px;color:var(--muted);background:transparent;box-shadow:none;font-size:.9rem}.photo{display:none;margin-top:26px;text-align:center}.photo.visible{display:block;animation:reveal .5s ease}.photo img{display:block;width:100%;max-height:560px;object-fit:cover;border-radius:20px;border:2px solid #fff4}.caption{margin:14px 0 0;color:#ffb4a9;font-size:1.15rem;font-weight:800}@keyframes reveal{from{opacity:0;transform:translateY(14px) scale(.98)}to{opacity:1;transform:none}}@media(max-width:480px){header,main{padding-left:20px;padding-right:20px}}
</style></head><body><section class="app"><header><h1>Norm’s Question Counter</h1><p class="subtitle">Because apparently there are only 10 questions per day.</p></header><main><div class="counter"><div class="number" id="number">0</div><div class="of">questions asked today · limit: 10</div></div><div class="meter"><div class="fill" id="fill"></div></div><div class="status" id="status"></div><button id="ask">Norm asked a question</button><button class="reset" id="reset">Reset for a new day</button><div class="photo" id="photo"><img src="IMG_9574.jpeg" alt="Norm looking frustrated and raising his middle finger"><p class="caption">That’s it, Norm. Questions are closed for today.</p></div></main></section><script>const limit=10;let count=+localStorage.getItem('normQuestions')||0;const n=document.getElementById('number'),f=document.getElementById('fill'),s=document.getElementById('status'),a=document.getElementById('ask'),r=document.getElementById('reset'),p=document.getElementById('photo');function update(){let pct=Math.min(count/limit*100,100),left=limit-count;n.textContent=count;f.style.width=pct+'%';document.body.classList.toggle('warm',count>=6&&count<limit);document.body.classList.toggle('limit',count>=limit);if(count>=limit){n.style.color='#ff6b6b';f.style.background='#ff4d5d';s.textContent='LIMIT REACHED. Norm has officially run out of questions.';a.textContent='No more questions today';a.disabled=true;p.classList.add('visible')}else{a.disabled=false;p.classList.remove('visible');if(count>=8){n.style.color='#ff8d4d';f.style.background='#ff8d4d';s.textContent=left+' question'+(left===1?'':'s')+' left. Dangerously inquisitive.'}else if(count>=6){n.style.color='#ffd166';f.style.background='#ffd166';s.textContent=left+' questions left. Things are getting warm.'}else if(count){n.style.color='#35d07f';f.style.background='#35d07f';s.textContent=left+' questions remaining. Keep it brief, Norm.'}else{s.textContent='Norm is being suspiciously quiet.'}}}a.onclick=()=>{if(count<limit){count++;localStorage.setItem('normQuestions',count);n.classList.add('bump');setTimeout(()=>n.classList.remove('bump'),250);update()}};r.onclick=()=>{count=0;localStorage.setItem('normQuestions',0);update()};update();</script></body></html>
